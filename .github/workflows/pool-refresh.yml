name: Pool refresh

# proxian owns the validated proxy pool. This workflow does NOT build the tools —
# it downloads the prebuilt release binaries of proxplore (harvest) and proxalyze
# (validate) from their GitHub Releases (linux x86_64), runs harvest -> validate,
# and commits the validated pool back into THIS repo's out/ dir. GitHub runners
# are already isolated microVMs, so no external sandbox is used; update.py (repo
# root) is the local/sandbox fallback.
#
# Releases are public, so the default GITHUB_TOKEN (or plain curl) fetches them.
# Pin a version via the *_version inputs (a git tag); empty -> latest release.
#
# Quality note: proxalyze writes a survivor when status is "live" OR
# "auth-required" (main.rs:223), but an "auth-required" proxy is only
# reachable-with-a-login, NOT proven usable. So the committed pool is
# LIVE-only: the gate measures the LIVE count (= survivors minus
# auth-required, == proxalyze's verdict "live" number), drops the
# auth-required rows from out/ before committing, and refuses to overwrite a
# good pool when live collapses — which a shared datacenter egress IP does
# against these free feeds without a rotating proxy.
# Set the PROXPLORE_PROXY_URL secret to a rotating gateway to raise the live yield.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily — off the top of the hour
  workflow_dispatch:
    inputs:
      proxplore_version:
        description: "proxplore release tag (empty = latest)"
        required: false
        default: ""
      proxalyze_version:
        description: "proxalyze release tag (empty = latest)"
        required: false
        default: ""
      providers:
        description: "Restrict proxplore to these provider ids (comma-separated; empty = all)"
        required: false
        default: ""
      jobs:
        description: "proxalyze concurrency (-j)"
        required: false
        default: "1024"
      min_live:
        description: "Fail (and keep last good pool) if fewer than this many LIVE proxies"
        required: false
        default: "100"

permissions:
  contents: write

env:
  PROXPLORE_REPO: rianilham28/proxplore
  PROXALYZE_REPO: rianilham28/proxalyze
  TARGET: x86_64-unknown-linux-gnu

concurrency:
  group: pool-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # proxian (this repo) — owns out/

      # Fetch + install both release binaries into ./bin, verify they run. The
      # tarballs wrap the binary in a <name>-<tag>-<target>/ dir (per each repo's
      # release.yml), so we locate it by find rather than hardcoding the layout.
      - name: Fetch release binaries
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bin"
          fetch() { # repo  tag  name
            local repo tag name pat dl unpack tarball
            repo="$1"; tag="$2"; name="$3"
            # Scope the pattern to THIS tool and use a fresh download dir:
            # a shared dir with "*-$TARGET.tar.gz" made find pick the other
            # tool's tarball, silently install nothing, then die at --version.
            pat="${name}-*-${TARGET}.tar.gz"
            dl=$(mktemp -d)
            if [ -n "$tag" ]; then
              gh release download "$tag" -R "$repo" --pattern "$pat" -D "$dl"
            else
              gh release download -R "$repo" --pattern "$pat" -D "$dl"  # no tag => latest
            fi
            tarball=$(find "$dl" -name "$pat" | head -1)
            if [ -z "$tarball" ]; then
              echo "::error::no asset matching '$pat' in $repo${tag:+ @ $tag}"
              exit 1
            fi
            unpack=$(mktemp -d); tar -xzf "$tarball" -C "$unpack"
            find "$unpack" -type f -name "$name" -exec install -m 0755 {} "$GITHUB_WORKSPACE/bin/$name" \;
            if [ ! -x "$GITHUB_WORKSPACE/bin/$name" ]; then
              echo "::error::$name not found inside $tarball"
              exit 1
            fi
          }
          fetch "$PROXPLORE_REPO"  "${{ inputs.proxplore_version }}"  proxplore
          fetch "$PROXALYZE_REPO"  "${{ inputs.proxalyze_version }}"  proxalyze
          bin/proxplore  --version
          bin/proxalyze  --version
        working-directory: ${{ github.workspace }}

      # GitHub renders an unset secret as "" (not absent); proxplore binds
      # --proxy-url to $PROXPLORE_PROXY_URL via clap's env trait, which reads a
      # present-but-empty var as a proxy URL -> wreq RelativeUrlWithoutBase.
      - name: Harvest (proxplore)
        env:
          PROXPLORE_PROXY_URL: ${{ secrets.PROXPLORE_PROXY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROXPLORE_PROXY_URL:-}" ]; then unset PROXPLORE_PROXY_URL; fi
          ws="$GITHUB_WORKSPACE"
          mkdir -p "$ws/work"
          args=(--output "$ws/work/proxies.txt")
          if [ -n "${{ inputs.providers }}" ]; then args+=(--providers "${{ inputs.providers }}"); fi
          "$ws/bin/proxplore" "${args[@]}"
          echo "harvested $(wc -l < "$ws/work/proxies.txt") candidates"

      - name: Validate (proxalyze)
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          mkdir -p "$ws/out"
          "$ws/bin/proxalyze" -i "$ws/work/proxies.txt" --out "$ws/out" \
            -j "${{ inputs.jobs || '1024' }}"
          echo "wrote out/: $(wc -l < "$ws/out/proxies.txt") survivors"

      - name: Upload raw harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-harvest-${{ github.run_id }}
          path: work/proxies.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Score + gate
        id: gate
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          stats=$(python3 - "$ws/out/proxies.jsonl" "$ws/out/proxies.txt" <<'PY'
          import json, sys
          jsonl, txt = sys.argv[1], sys.argv[2]
          kept, total, auth, exit_live = [], 0, 0, 0
          for raw in open(jsonl):
              ln = raw.strip()
              if not ln:
                  continue
              total += 1
              r = json.loads(ln)
              if "auth-required" in (r.get("tags") or []):
                  auth += 1
                  continue
              if r.get("exit_ip"):
                  exit_live += 1
              kept.append((raw, r["proxy"]))
          # survivor = live OR auth-required, so genuinely-live = total - auth-required.
          # The committed pool is LIVE-only: auth-required rows are measured
          # above, then dropped from both output files (kept rows are written
          # back byte-for-byte; txt is rebuilt from their proxy fields so the
          # two files stay row-consistent).
          with open(jsonl, "w") as f:
              f.writelines(raw for raw, _ in kept)
          with open(txt, "w") as f:
              f.writelines(proxy + "\n" for _, proxy in kept)
          print(total - auth, auth, exit_live)
          PY
          )
          read -r live auth exit_live <<<"$stats"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "exit_live=$exit_live" >> "$GITHUB_OUTPUT"
          echo "survivors: $((live + auth)) = live $live + auth-required $auth ($exit_live proved exit-IP)"
          echo "committed pool is live-only: dropped $auth auth-required rows"
          min_live="${{ inputs.min_live || '100' }}"
          if [ "$live" -lt "$min_live" ]; then
            echo "::error::only $live LIVE proxies (< min_live=$min_live); keeping the last-good pool, not committing"
            exit 1
          fi
          echo "pool is good ($live live) — will commit"

      - name: Commit + push pool
        if: steps.gate.outputs.live != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/proxies.txt out/proxies.jsonl
          if git diff --staged --quiet; then
            echo "pool unchanged — nothing to commit"
            exit 0
          fi
          # [skip ci]: pushing to main would otherwise re-trigger CI's push job.
          git commit -m "chore(pool): refresh validated proxies ($(date -u +%Y-%m-%d)) — live ${{ steps.gate.outputs.live }}, dropped ${{ steps.gate.outputs.auth }} auth-required [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
